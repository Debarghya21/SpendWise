# Optional autoscaling (requires metrics-server:  minikube addons enable metrics-server)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: purchase-order-service
  namespace: spendwise
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: purchase-order-service }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: supplier-service
  namespace: spendwise
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: supplier-service }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
