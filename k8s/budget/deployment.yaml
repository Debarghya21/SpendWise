apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-service
  namespace: spendwise
  labels: { app: budget-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: budget-service }
  template:
    metadata:
      labels: { app: budget-service, tier: backend }
    spec:
      containers:
        - name: budget-service
          image: spendwise/spendwise-budget:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 3004, name: http }
            - { containerPort: 50052, name: grpc }
          env:
            - { name: PORT, value: "3004" }
            - { name: GRPC_PORT, value: "50052" }
            - { name: DB_HOST, valueFrom: { configMapKeyRef: { name: spendwise-config, key: BUDGET_DB_HOST } } }
            - { name: DB_NAME, valueFrom: { configMapKeyRef: { name: spendwise-config, key: BUDGET_DB_NAME } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: spendwise-secrets, key: BUDGET_DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: spendwise-secrets, key: BUDGET_DB_PASSWORD } } }
            - { name: RABBITMQ_URL, valueFrom: { secretKeyRef: { name: spendwise-secrets, key: RABBITMQ_URL } } }
          readinessProbe:
            httpGet: { path: /ready, port: 3004 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits: { memory: 256Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: budget-service
  namespace: spendwise
spec:
  selector: { app: budget-service }
  ports:
    - { port: 3004, targetPort: 3004, name: http }
    - { port: 50052, targetPort: 50052, name: grpc }
