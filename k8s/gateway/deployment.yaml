apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: spendwise
  labels: { app: api-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway, tier: edge }
    spec:
      containers:
        - name: api-gateway
          image: spendwise/spendwise-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: spendwise-config }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { memory: 32Mi, cpu: 50m }
            limits: { memory: 128Mi, cpu: 250m }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: spendwise
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30080 }]
