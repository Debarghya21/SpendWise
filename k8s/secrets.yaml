# DEMO credentials only. For a real deployment create this Secret out-of-band, e.g.:
#   kubectl create secret generic spendwise-secrets -n spendwise --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: spendwise-secrets
  namespace: spendwise
type: Opaque
stringData:
  SUPPLIER_DB_USER: "supplier_user"
  SUPPLIER_DB_PASSWORD: "supplier_pass"
  PO_DB_USER: "po_user"
  PO_DB_PASSWORD: "po_pass"
  PO_DB_ROOT_PASSWORD: "root_pass"
  BUDGET_DB_USER: "budget_user"
  BUDGET_DB_PASSWORD: "budget_pass"
  ANALYTICS_DB_USER: "analytics_user"
  ANALYTICS_DB_PASSWORD: "analytics_pass"
  RABBITMQ_USER: "spendwise"
  RABBITMQ_PASSWORD: "spendwise_pass"
  RABBITMQ_URL: "amqp://spendwise:spendwise_pass@rabbitmq:5672"
  RABBITMQ_URL_PY: "amqp://spendwise:spendwise_pass@rabbitmq:5672/%2F"
  MONGO_URL: "mongodb://analytics_user:analytics_pass@analytics-db:27017/?authSource=admin"
