apiVersion: apps/v1
kind: Deployment
metadata:
  name: purchase-order-service
  namespace: spendwise
  labels: { app: purchase-order-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: purchase-order-service }
  template:
    metadata:
      labels: { app: purchase-order-service, tier: backend }
    spec:
      containers:
        - name: purchase-order-service
          image: spendwise/spendwise-purchase-order:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8082 }]
          env:
            - { name: SERVER_PORT, value: "8082" }
            - { name: DB_HOST, valueFrom: { configMapKeyRef: { name: spendwise-config, key: PO_DB_HOST } } }
            - { name: DB_NAME, valueFrom: { configMapKeyRef: { name: spendwise-config, key: PO_DB_NAME } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: spendwise-secrets, key: PO_DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: spendwise-secrets, key: PO_DB_PASSWORD } } }
            - { name: RABBITMQ_HOST, valueFrom: { configMapKeyRef: { name: spendwise-config, key: RABBITMQ_HOST } } }
            - { name: RABBITMQ_PORT, valueFrom: { configMapKeyRef: { name: spendwise-config, key: RABBITMQ_PORT } } }
            - { name: RABBITMQ_USER, valueFrom: { secretKeyRef: { name: spendwise-secrets, key: RABBITMQ_USER } } }
            - { name: RABBITMQ_PASSWORD, valueFrom: { secretKeyRef: { name: spendwise-secrets, key: RABBITMQ_PASSWORD } } }
            - { name: SUPPLIER_SERVICE_URL, valueFrom: { configMapKeyRef: { name: spendwise-config, key: SUPPLIER_SERVICE_URL } } }
            - { name: BUDGET_SERVICE_URL, valueFrom: { configMapKeyRef: { name: spendwise-config, key: BUDGET_SERVICE_URL } } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            periodSeconds: 5
            failureThreshold: 36   # up to 3 minutes for JVM + DB schema
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            periodSeconds: 10
          resources:
            requests: { memory: 384Mi, cpu: 200m }
            limits: { memory: 768Mi, cpu: "1" }
---
apiVersion: v1
kind: Service
metadata:
  name: purchase-order-service
  namespace: spendwise
spec:
  selector: { app: purchase-order-service }
  ports: [{ port: 8082, targetPort: 8082 }]
