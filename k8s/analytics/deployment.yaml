apiVersion: apps/v1
kind: Deployment
metadata:
  name: spend-analytics-service
  namespace: spendwise
  labels: { app: spend-analytics-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: spend-analytics-service }
  template:
    metadata:
      labels: { app: spend-analytics-service, tier: backend }
    spec:
      containers:
        - name: spend-analytics-service
          image: spendwise/spendwise-analytics:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            - { name: MONGO_URL, valueFrom: { secretKeyRef: { name: spendwise-secrets, key: MONGO_URL } } }
            - { name: MONGO_DB, valueFrom: { configMapKeyRef: { name: spendwise-config, key: ANALYTICS_DB_NAME } } }
            - { name: RABBITMQ_URL, valueFrom: { secretKeyRef: { name: spendwise-secrets, key: RABBITMQ_URL_PY } } }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 100m }
            limits: { memory: 384Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: spend-analytics-service
  namespace: spendwise
spec:
  selector: { app: spend-analytics-service }
  ports: [{ port: 8000, targetPort: 8000 }]
