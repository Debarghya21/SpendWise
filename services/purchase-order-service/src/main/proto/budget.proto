syntax = "proto3";

package spendwise.budget;

option java_multiple_files = true;
option java_package = "com.spendwise.grpc.budget";
option java_outer_classname = "BudgetProto";

service BudgetService {
  /** Atomically reserve budget for a purchase order. */
  rpc ReserveBudget (ReserveBudgetRequest) returns (ReserveBudgetResponse);
}

message ReserveBudgetRequest {
  string department = 1;
  string po_id      = 2;
  /** Amount in minor-unit-safe string representation (e.g. "2500.00"). */
  string amount     = 3;
}

message ReserveBudgetResponse {
  enum Outcome {
    RESERVED    = 0;
    REJECTED    = 1;
    UNAVAILABLE = 2;
  }
  Outcome outcome          = 1;
  int64   reservation_id   = 2;
  string  available_amount = 3;
  string  message          = 4;
}
