syntax = "proto3";

package spendwise.supplier;

option java_multiple_files = true;
option java_package = "com.spendwise.grpc.supplier";
option java_outer_classname = "SupplierProto";

service SupplierService {
  /** Check whether a supplier is eligible for new purchase orders. */
  rpc ValidateSupplier (ValidateSupplierRequest) returns (SupplierValidationResponse);
}

message ValidateSupplierRequest {
  string supplier_id = 1;
}

message SupplierValidationResponse {
  string supplier_id = 1;
  string name        = 2;
  string category    = 3;
  string status      = 4;
  bool   eligible    = 5;
  string reason      = 6;
}
